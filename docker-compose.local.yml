# Start: docker compose -f docker-compose.local.yml up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: poli-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.53
    container_name: poli-s3
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-s3.autoCreateBucket=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_PUBLIC_BUCKET},${S3_PRIVATE_BUCKET}
    ports:
      - "127.0.0.1:${S3_PORT}:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data: